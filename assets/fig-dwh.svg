<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Medallion data warehouse architecture: bronze, silver, gold">
  <rect width="760" height="320" fill="#12131f"/>
  <text x="40" y="38" fill="#e8eaff" font-family="Inter,Arial" font-size="16" font-weight="800">Medallion architecture (Bronze → Silver → Gold)</text>

  <!-- sources -->
  <g font-family="Inter,Arial" font-size="11">
    <text x="40" y="74" fill="#9aa0c0" font-weight="700">Sources</text>
    <g transform="translate(40,84)">
      <rect width="96" height="34" rx="8" fill="#181a2b" stroke="#272a45"/><text x="48" y="22" fill="#cdd2f0" text-anchor="middle">ERP</text>
      <rect y="44" width="96" height="34" rx="8" fill="#181a2b" stroke="#272a45"/><text x="48" y="66" fill="#cdd2f0" text-anchor="middle">CRM</text>
      <rect y="88" width="96" height="34" rx="8" fill="#181a2b" stroke="#272a45"/><text x="48" y="110" fill="#cdd2f0" text-anchor="middle">Excel</text>
    </g>
  </g>

  <!-- connectors source->bronze -->
  <g stroke="#3a3f5e" stroke-width="2">
    <line x1="136" y1="101" x2="176" y2="120"/>
    <line x1="136" y1="145" x2="176" y2="140"/>
    <line x1="136" y1="189" x2="176" y2="160"/>
  </g>

  <!-- layers -->
  <g font-family="Inter,Arial">
    <!-- Bronze -->
    <g transform="translate(178,84)">
      <rect width="150" height="150" rx="14" fill="#2a1d12" stroke="#7a5326"/>
      <circle cx="24" cy="28" r="7" fill="#cd7f32"/>
      <text x="40" y="32" fill="#e8c9a0" font-size="13.5" font-weight="800">Bronze</text>
      <text x="18" y="58" fill="#c9a98a" font-size="11">Raw, as-ingested</text>
      <text x="18" y="78" fill="#9aa0c0" font-size="10.5">• full traceability</text>
      <text x="18" y="96" fill="#9aa0c0" font-size="10.5">• src_&lt;system&gt;_&lt;table&gt;</text>
      <text x="18" y="114" fill="#9aa0c0" font-size="10.5">• truncate–insert loads</text>
    </g>
    <!-- arrow -->
    <text x="338" y="164" fill="#7c5cff" font-size="22" font-weight="800">→</text>
    <!-- Silver -->
    <g transform="translate(364,84)">
      <rect width="150" height="150" rx="14" fill="#1c2030" stroke="#5a6480"/>
      <circle cx="24" cy="28" r="7" fill="#c0c6da"/>
      <text x="40" y="32" fill="#dfe3f2" font-size="13.5" font-weight="800">Silver</text>
      <text x="18" y="58" fill="#b9bed6" font-size="11">Clean &amp; standardised</text>
      <text x="18" y="78" fill="#9aa0c0" font-size="10.5">• typed &amp; deduped</text>
      <text x="18" y="96" fill="#9aa0c0" font-size="10.5">• business rules</text>
      <text x="18" y="114" fill="#9aa0c0" font-size="10.5">• conformed keys</text>
    </g>
    <text x="524" y="164" fill="#7c5cff" font-size="22" font-weight="800">→</text>
    <!-- Gold -->
    <g transform="translate(550,84)">
      <rect width="170" height="150" rx="14" fill="#2a2410" stroke="#7a6a26"/>
      <circle cx="24" cy="28" r="7" fill="#f0b429"/>
      <text x="40" y="32" fill="#f5d98a" font-size="13.5" font-weight="800">Gold</text>
      <text x="18" y="58" fill="#d8c79a" font-size="11">Business-ready</text>
      <text x="18" y="78" fill="#9aa0c0" font-size="10.5">• star schema</text>
      <text x="18" y="96" fill="#9aa0c0" font-size="10.5">• fact_sales, dim_*</text>
      <text x="18" y="114" fill="#9aa0c0" font-size="10.5">• fast reporting views</text>
    </g>
  </g>

  <!-- consumers -->
  <text x="40" y="276" fill="#9aa0c0" font-family="Inter,Arial" font-size="11" font-weight="700">Consumed by</text>
  <g transform="translate(40,286)" font-family="Inter,Arial" font-size="11">
    <rect width="120" height="30" rx="8" fill="#1d2038" stroke="#7c5cff"/><text x="60" y="20" fill="#cdd2f0" text-anchor="middle">Power BI</text>
    <rect x="134" width="120" height="30" rx="8" fill="#1d2038" stroke="#7c5cff"/><text x="194" y="20" fill="#cdd2f0" text-anchor="middle">Ad-hoc SQL</text>
    <rect x="268" width="120" height="30" rx="8" fill="#1d2038" stroke="#7c5cff"/><text x="328" y="20" fill="#cdd2f0" text-anchor="middle">ML features</text>
  </g>
</svg>
