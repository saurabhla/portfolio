<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Confusion matrix prioritising recall for heart attack risk">
  <rect width="760" height="340" fill="#12131f"/>
  <text x="40" y="38" fill="#e8eaff" font-family="Inter,Arial" font-size="16" font-weight="800">Recall-first evaluation (post-SMOTE k-NN)</text>

  <!-- Confusion matrix -->
  <text x="60" y="74" fill="#9aa0c0" font-family="Inter,Arial" font-size="12.5" font-weight="700">Confusion matrix</text>
  <g transform="translate(130,92)" font-family="Inter,Arial">
    <text x="78" y="-2" fill="#7e8299" font-size="11" text-anchor="middle">Predicted</text>
    <text x="60" y="20" fill="#9aa0c0" font-size="11" text-anchor="middle">No risk</text>
    <text x="150" y="20" fill="#9aa0c0" font-size="11" text-anchor="middle">At risk</text>
    <text x="-12" y="60" fill="#9aa0c0" font-size="11" text-anchor="middle" transform="rotate(-90,-12,60)">No risk</text>
    <text x="-12" y="150" fill="#9aa0c0" font-size="11" text-anchor="middle" transform="rotate(-90,-12,150)">At risk</text>
    <rect x="16" y="30" width="88" height="64" rx="6" fill="#1d9e75" fill-opacity="0.85"/>
    <text x="60" y="68" fill="#04221c" font-size="20" font-weight="800" text-anchor="middle">TN</text>
    <rect x="110" y="30" width="88" height="64" rx="6" fill="#2a2e4a"/>
    <text x="154" y="62" fill="#cdd2f0" font-size="13" font-weight="700" text-anchor="middle">FP</text>
    <!-- FN highlighted as minimised -->
    <rect x="16" y="100" width="88" height="64" rx="6" fill="#2a2e4a" stroke="#e24b4a" stroke-width="2"/>
    <text x="60" y="134" fill="#ff9aae" font-size="13" font-weight="800" text-anchor="middle">FN ↓</text>
    <text x="60" y="150" fill="#9aa0c0" font-size="9" text-anchor="middle">minimised</text>
    <rect x="110" y="100" width="88" height="64" rx="6" fill="#1d9e75" fill-opacity="0.85"/>
    <text x="154" y="138" fill="#04221c" font-size="20" font-weight="800" text-anchor="middle">TP</text>
  </g>

  <!-- Why recall callout + metrics -->
  <g transform="translate(440,92)" font-family="Inter,Arial">
    <rect x="0" y="0" width="280" height="170" rx="12" fill="#181a2b" stroke="#272a45"/>
    <text x="18" y="32" fill="#e8eaff" font-size="13.5" font-weight="800">Why recall?</text>
    <text x="18" y="56" fill="#b4b7d3" font-size="11.5">A missed at-risk patient (false negative)</text>
    <text x="18" y="73" fill="#b4b7d3" font-size="11.5">is far costlier than a false alarm, so the</text>
    <text x="18" y="90" fill="#b4b7d3" font-size="11.5">threshold is tuned to maximise recall.</text>
    <!-- metric chips -->
    <g transform="translate(18,108)">
      <rect x="0" y="0" width="78" height="44" rx="9" fill="#1d2038" stroke="#33c5a6"/>
      <text x="39" y="20" fill="#5fe3c2" font-size="15" font-weight="800" text-anchor="middle">High</text>
      <text x="39" y="35" fill="#8aa39b" font-size="10" text-anchor="middle">Recall</text>
      <rect x="90" y="0" width="78" height="44" rx="9" fill="#1d2038" stroke="#7c5cff"/>
      <text x="129" y="20" fill="#cdd2f0" font-size="15" font-weight="800" text-anchor="middle">F1 ✓</text>
      <text x="129" y="35" fill="#9aa0c0" font-size="10" text-anchor="middle">balanced</text>
      <rect x="180" y="0" width="82" height="44" rx="9" fill="#1d2038" stroke="#3a3f5e"/>
      <text x="221" y="20" fill="#cdd2f0" font-size="13" font-weight="800" text-anchor="middle">SMOTE</text>
      <text x="221" y="35" fill="#9aa0c0" font-size="10" text-anchor="middle">balanced</text>
    </g>
  </g>
  <text x="40" y="300" fill="#7e8299" font-family="Inter,Arial" font-size="11.5">Compared: LR, SVM, k-NN, Decision Tree, Random Forest, XGBoost, k-NN (post-SMOTE) chosen on recall/F1.</text>
</svg>
