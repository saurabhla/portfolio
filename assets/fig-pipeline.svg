<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Five-stage AI data validation pipeline with human checkpoint">
  <rect width="760" height="300" fill="#12131f"/>
  <text x="34" y="40" fill="#e8eaff" font-family="Inter,Arial" font-size="16" font-weight="800">Rule-driven validation with a human checkpoint</text>

  <!-- flow connectors -->
  <g stroke="#7c5cff" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.85">
    <line x1="150" y1="150" x2="170" y2="150"/>
    <line x1="286" y1="150" x2="306" y2="150"/>
    <line x1="422" y1="150" x2="442" y2="150"/>
    <line x1="558" y1="150" x2="578" y2="150"/>
  </g>

  <g font-family="Inter,Arial">
    <!-- 1 Excel -->
    <g transform="translate(34,108)">
      <rect width="116" height="84" rx="14" fill="#181a2b" stroke="#272a45"/>
      <rect x="42" y="16" width="32" height="30" rx="5" fill="#1f7a4d"/>
      <text x="58" y="38" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">X</text>
      <text x="58" y="68" fill="#cdd2f0" font-size="11.5" text-anchor="middle" font-weight="700">Excel input</text>
    </g>
    <!-- 2 Profile (magnifier) -->
    <g transform="translate(170,108)">
      <rect width="116" height="84" rx="14" fill="#181a2b" stroke="#272a45"/>
      <circle cx="53" cy="32" r="11" fill="none" stroke="#bfa8ff" stroke-width="3"/>
      <line x1="61" y1="40" x2="69" y2="48" stroke="#bfa8ff" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="68" fill="#cdd2f0" font-size="11.5" text-anchor="middle" font-weight="700">Profile data</text>
    </g>
    <!-- 3 Validate vs rules -->
    <g transform="translate(306,108)">
      <rect width="116" height="84" rx="14" fill="#181a2b" stroke="#272a45"/>
      <text x="58" y="38" fill="#bfa8ff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">{ rules }</text>
      <text x="58" y="68" fill="#cdd2f0" font-size="11.5" text-anchor="middle" font-weight="700">Validate</text>
    </g>
    <!-- 4 Checkpoint (pause bars, highlighted) -->
    <g transform="translate(442,108)">
      <rect width="116" height="84" rx="14" fill="#1a1530" stroke="#f0b429"/>
      <rect x="50" y="22" width="6" height="20" rx="3" fill="#f0b429"/>
      <rect x="60" y="22" width="6" height="20" rx="3" fill="#f0b429"/>
      <text x="58" y="68" fill="#ffd98a" font-size="11.5" text-anchor="middle" font-weight="700">Confirm change</text>
    </g>
    <!-- 5 Report -->
    <g transform="translate(578,108)">
      <rect width="116" height="84" rx="14" fill="#10221c" stroke="#33c5a6"/>
      <path d="M44,40 l9,9 16,-18" fill="none" stroke="#5fe3c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="70" fill="#7ff0d2" font-size="11.5" text-anchor="middle" font-weight="700">Clean report</text>
    </g>
  </g>

  <!-- human-in-the-loop callout under node 4 -->
  <g transform="translate(410,206)">
    <path d="M90,-12 l-7,12 14,0 Z" fill="#f0b429"/>
    <rect x="0" y="0" width="180" height="44" rx="10" fill="#1a1530" stroke="#3a2f12"/>
    <text x="90" y="19" fill="#ffd98a" font-family="Inter,Arial" font-size="11.5" font-weight="800" text-anchor="middle">Human-in-the-loop</text>
    <text x="90" y="35" fill="#c9a96a" font-family="Inter,Arial" font-size="10.5" text-anchor="middle">no silent edits, every fix confirmed</text>
  </g>

  <text x="34" y="250" fill="#7e8299" font-family="Inter,Arial" font-size="11.5">Business rules live in version-controlled JSON, so the same flow runs consistently on any new file.</text>
</svg>
