<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="AI-accelerated data validation pipeline">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a2e"/><stop offset="1" stop-color="#0e0f1c"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a47"/><stop offset="1" stop-color="#1b1e34"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#abg)"/>
  <!-- connectors -->
  <g stroke="#7c5cff" stroke-width="3" stroke-dasharray="6 6" opacity="0.8">
    <line x1="118" y1="120" x2="186" y2="120"/>
    <line x1="294" y1="120" x2="362" y2="120"/>
  </g>
  <line x1="206" y1="186" x2="206" y2="210" stroke="#7c5cff" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/>
  <!-- node 1: Excel -->
  <g transform="translate(40,84)">
    <rect width="78" height="72" rx="14" fill="url(#node)" stroke="#2c2f4d"/>
    <rect x="20" y="18" width="38" height="36" rx="5" fill="#1f7a4d"/>
    <text x="39" y="42" fill="#fff" font-family="Inter,Arial" font-size="15" font-weight="800" text-anchor="middle">X</text>
    <text x="39" y="66" fill="#9aa0c0" font-family="Inter,Arial" font-size="9.5" text-anchor="middle" transform="translate(0,2)">Excel</text>
  </g>
  <!-- node 2: rules -->
  <g transform="translate(186,84)">
    <rect width="108" height="72" rx="14" fill="url(#node)" stroke="#2c2f4d"/>
    <text x="54" y="32" fill="#bfa8ff" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">{ rules }</text>
    <rect x="22" y="44" width="64" height="6" rx="3" fill="#3a3f5e"/>
    <rect x="22" y="55" width="44" height="6" rx="3" fill="#33374f"/>
    <text x="54" y="-8" fill="#9aa0c0" font-family="Inter,Arial" font-size="10" text-anchor="middle">JSON business rules</text>
  </g>
  <!-- node 3: AI validate -->
  <g transform="translate(362,84)">
    <rect width="78" height="72" rx="14" fill="url(#node)" stroke="#7c5cff"/>
    <circle cx="39" cy="30" r="15" fill="none" stroke="#bfa8ff" stroke-width="2.5"/>
    <path d="M31,30 l6,6 11,-13" fill="none" stroke="#5fe3c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="39" y="62" fill="#cdd2f0" font-family="Inter,Arial" font-size="9.5" text-anchor="middle">Validate</text>
  </g>
  <!-- node 4: report -->
  <g transform="translate(166,210)">
    <rect width="148" height="40" rx="12" fill="#10221c" stroke="#33c5a6"/>
    <path d="M22,20 l7,7 12,-14" fill="none" stroke="#5fe3c2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="25" fill="#7ff0d2" font-family="Inter,Arial" font-size="12.5" font-weight="700" text-anchor="middle">Clean report</text>
  </g>
  <!-- title chip -->
  <g transform="translate(28,24)">
    <rect x="0" y="0" width="222" height="26" rx="13" fill="#1d2038" stroke="#2c2f4d"/>
    <circle cx="16" cy="13" r="5" fill="#9a88ff"/>
    <text x="30" y="17" fill="#e8eaff" font-family="Inter,Arial" font-size="12.5" font-weight="700">AI Validation · Claude Code</text>
  </g>
</svg>
